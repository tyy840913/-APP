name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 工具
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      - name: 安装 SDK 平台与构建工具
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 生成全部项目文件
        run: |
          mkdir -p app/src/main/java/com/ai/shell
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # ============ Gradle 配置 ============
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AIWebShell"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ai.shell"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.ai.shell"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
          }
          EOF

          # ============ 清单 ============
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.App"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".BrowserActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|density|uiMode" />
              </application>
          </manifest>
          EOF

          # ============ 数据存储 ============
          cat > app/src/main/java/com/ai/shell/SiteStore.kt << 'EOF'
          package com.ai.shell

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          data class Site(val id: Long, val name: String, val url: String)

          object SiteStore {
              private const val FILE = "ai_shell_prefs"
              private const val KEY_SITES = "sites"
              private const val KEY_REFRESH = "refresh_ms"
              private const val DEFAULT_REFRESH = 30_000L

              private fun prefs(context: Context) =
                  context.getSharedPreferences(FILE, Context.MODE_PRIVATE)

              fun load(context: Context): MutableList<Site> {
                  val list = mutableListOf<Site>()
                  try {
                      val arr = JSONArray(prefs(context).getString(KEY_SITES, "[]") ?: "[]")
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          list.add(Site(o.getLong("id"), o.getString("name"), o.getString("url")))
                      }
                  } catch (e: Exception) {
                  }
                  return list
              }

              fun save(context: Context, sites: List<Site>) {
                  val arr = JSONArray()
                  for (s in sites) {
                      val o = JSONObject()
                      o.put("id", s.id)
                      o.put("name", s.name)
                      o.put("url", s.url)
                      arr.put(o)
                  }
                  prefs(context).edit().putString(KEY_SITES, arr.toString()).apply()
              }

              fun add(context: Context, name: String, url: String) {
                  val sites = load(context)
                  sites.add(Site(System.currentTimeMillis(), name, url))
                  save(context, sites)
              }

              fun update(context: Context, id: Long, name: String, url: String) {
                  val sites = load(context)
                  val i = sites.indexOfFirst { it.id == id }
                  if (i >= 0) {
                      sites[i] = Site(id, name, url)
                      save(context, sites)
                  }
              }

              fun delete(context: Context, id: Long) {
                  save(context, load(context).filter { it.id != id })
              }

              fun byId(context: Context, id: Long): Site? =
                  load(context).firstOrNull { it.id == id }

              fun getRefreshInterval(context: Context): Long =
                  prefs(context).getLong(KEY_REFRESH, DEFAULT_REFRESH)

              fun setRefreshInterval(context: Context, ms: Long) {
                  prefs(context).edit().putLong(KEY_REFRESH, ms).apply()
              }
          }
          EOF

          # ============ 首页（网站列表） ============
          cat > app/src/main/java/com/ai/shell/MainActivity.kt << 'EOF'
          package com.ai.shell

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.RadioGroup
          import android.widget.TextView
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.google.android.material.appbar.MaterialToolbar
          import com.google.android.material.dialog.MaterialAlertDialogBuilder
          import com.google.android.material.floatingactionbutton.FloatingActionButton
          import com.google.android.material.textfield.TextInputEditText
          import com.google.android.material.textfield.TextInputLayout

          class MainActivity : AppCompatActivity() {

              private lateinit var adapter: SiteAdapter
              private lateinit var emptyView: View
              private var sites: List<Site> = emptyList()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  findViewById<MaterialToolbar>(R.id.toolbar).apply {
                      inflateMenu(R.menu.menu_home)
                      setOnMenuItemClickListener { item ->
                          if (item.itemId == R.id.action_settings) {
                              showSettingsDialog()
                              true
                          } else false
                      }
                  }

                  val recycler = findViewById<RecyclerView>(R.id.recycler)
                  emptyView = findViewById(R.id.empty_view)
                  adapter = SiteAdapter(
                      onOpen = { openSite(it) },
                      onLongPress = { showItemMenu(it) }
                  )
                  recycler.layoutManager = LinearLayoutManager(this)
                  recycler.adapter = adapter

                  findViewById<FloatingActionButton>(R.id.fab).setOnClickListener { showSiteDialog(null) }

                  reload()
              }

              override fun onResume() {
                  super.onResume()
                  reload()
              }

              private fun reload() {
                  sites = SiteStore.load(this)
                  adapter.update(sites)
                  emptyView.visibility = if (sites.isEmpty()) View.VISIBLE else View.GONE
              }

              private fun openSite(site: Site) {
                  startActivity(Intent(this, BrowserActivity::class.java).putExtra("id", site.id))
              }

              private fun showItemMenu(site: Site) {
                  MaterialAlertDialogBuilder(this)
                      .setTitle(site.name)
                      .setItems(arrayOf("编辑", "在系统浏览器中打开", "删除")) { _, which ->
                          when (which) {
                              0 -> showSiteDialog(site)
                              1 -> try {
                                  startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(site.url)))
                              } catch (e: Exception) {
                              }
                              2 -> MaterialAlertDialogBuilder(this)
                                  .setMessage("确定删除「${site.name}」吗？")
                                  .setPositiveButton("删除") { _, _ ->
                                      SiteStore.delete(this, site.id)
                                      reload()
                                  }
                                  .setNegativeButton("取消", null)
                                  .show()
                          }
                      }
                      .show()
              }

              private fun showSiteDialog(site: Site?) {
                  val view = layoutInflater.inflate(R.layout.dialog_site, null)
                  val nameInput = view.findViewById<TextInputEditText>(R.id.input_name)
                  val urlInput = view.findViewById<TextInputEditText>(R.id.input_url)
                  val urlLayout = view.findViewById<TextInputLayout>(R.id.input_url_layout)
                  if (site != null) {
                      nameInput.setText(site.name)
                      urlInput.setText(site.url)
                  }
                  val dialog = MaterialAlertDialogBuilder(this)
                      .setTitle(if (site == null) "添加网站" else "编辑网站")
                      .setView(view)
                      .setPositiveButton("保存", null)
                      .setNegativeButton("取消", null)
                      .create()
                  dialog.setOnShowListener {
                      dialog.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener {
                          var url = urlInput.text?.toString()?.trim().orEmpty()
                          if (url.isEmpty()) {
                              urlLayout.error = "请输入网址"
                              return@setOnClickListener
                          }
                          urlLayout.error = null
                          if (!url.startsWith("http://") && !url.startsWith("https://")) url = "https://$url"
                          var name = nameInput.text?.toString()?.trim().orEmpty()
                          if (name.isEmpty()) name = try {
                              Uri.parse(url).host ?: url
                          } catch (e: Exception) {
                              url
                          }
                          if (site == null) SiteStore.add(this, name, url)
                          else SiteStore.update(this, site.id, name, url)
                          reload()
                          dialog.dismiss()
                      }
                  }
                  dialog.show()
              }

              private fun showSettingsDialog() {
                  val view = layoutInflater.inflate(R.layout.dialog_settings, null)
                  val group = view.findViewById<RadioGroup>(R.id.refresh_group)
                  when (SiteStore.getRefreshInterval(this)) {
                      0L -> group.check(R.id.refresh_off)
                      10_000L -> group.check(R.id.refresh_10s)
                      60_000L -> group.check(R.id.refresh_1min)
                      300_000L -> group.check(R.id.refresh_5min)
                      else -> group.check(R.id.refresh_30s)
                  }
                  MaterialAlertDialogBuilder(this)
                      .setTitle("回到前台自动刷新")
                      .setView(view)
                      .setPositiveButton("确定") { _, _ ->
                          val ms = when (group.checkedRadioButtonId) {
                              R.id.refresh_off -> 0L
                              R.id.refresh_10s -> 10_000L
                              R.id.refresh_1min -> 60_000L
                              R.id.refresh_5min -> 300_000L
                              else -> 30_000L
                          }
                          SiteStore.setRefreshInterval(this, ms)
                      }
                      .setNegativeButton("取消", null)
                      .show()
              }
          }

          class SiteAdapter(
              private val onOpen: (Site) -> Unit,
              private val onLongPress: (Site) -> Unit
          ) : RecyclerView.Adapter<SiteAdapter.VH>() {

              private var items: List<Site> = emptyList()
              private val colors = intArrayOf(
                  0xFF2E6BE6.toInt(), 0xFF7C3AED.toInt(), 0xFF059669.toInt(),
                  0xFFDB2777.toInt(), 0xFFD97706.toInt()
              )

              fun update(newItems: List<Site>) {
                  items = newItems
                  notifyDataSetChanged()
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val v = LayoutInflater.from(parent.context).inflate(R.layout.item_site, parent, false)
                  return VH(v)
              }

              override fun getItemCount() = items.size

              override fun onBindViewHolder(holder: VH, position: Int) {
                  val s = items[position]
                  holder.name.text = s.name
                  holder.url.text = s.url
                  holder.avatar.text = s.name.take(1).uppercase()
                  holder.avatar.background.setTint(colors[position % colors.size])
                  holder.itemView.setOnClickListener {
                      val pos = holder.bindingAdapterPosition
                      if (pos != RecyclerView.NO_POSITION) onOpen(items[pos])
                  }
                  holder.itemView.setOnLongClickListener {
                      val pos = holder.bindingAdapterPosition
                      if (pos != RecyclerView.NO_POSITION) onLongPress(items[pos])
                      true
                  }
              }

              class VH(view: View) : RecyclerView.ViewHolder(view) {
                  val avatar: TextView = view.findViewById(R.id.avatar)
                  val name: TextView = view.findViewById(R.id.name)
                  val url: TextView = view.findViewById(R.id.url)
              }
          }
          EOF

          # ============ 浏览器页（核心：前台检测刷新） ============
          cat > app/src/main/java/com/ai/shell/BrowserActivity.kt << 'EOF'
          package com.ai.shell

          import android.Manifest
          import android.app.DownloadManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Message
          import android.os.SystemClock
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.PermissionRequest
          import android.webkit.URLUtil
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.ProgressBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout
          import com.google.android.material.appbar.MaterialToolbar

          class BrowserActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private lateinit var progressBar: ProgressBar
              private lateinit var swipe: SwipeRefreshLayout
              private lateinit var webContainer: FrameLayout
              private lateinit var errorView: View
              private lateinit var errorText: TextView
              private lateinit var popupContainer: FrameLayout
              private lateinit var popupHolder: FrameLayout

              private var popupWebView: WebView? = null
              private var siteHost: String? = null
              private var pausedAt = 0L

              private var filePathCallback: ValueCallback<Array<Uri>>? = null
              private var pendingPermissionRequest: PermissionRequest? = null
              private var pendingDownload: DownloadManager.Request? = null

              private val fileChooserLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                      val cb = filePathCallback
                      filePathCallback = null
                      cb?.onReceiveValue(
                          WebChromeClient.FileChooserParams.parseResult(result.resultCode, result.data)
                      )
                  }

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                      val req = pendingPermissionRequest
                      pendingPermissionRequest = null
                      if (req != null) {
                          val ok = req.resources.all { res ->
                              when (res) {
                                  PermissionRequest.RESOURCE_AUDIO_CAPTURE ->
                                      checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                                  PermissionRequest.RESOURCE_VIDEO_CAPTURE ->
                                      checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
                                  else -> true
                              }
                          }
                          try {
                              if (ok) req.grant(req.resources) else req.deny()
                          } catch (e: Exception) {
                          }
                      }
                  }

              private val downloadPermissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                      val req = pendingDownload
                      pendingDownload = null
                      if (granted && req != null) enqueueDownload(req)
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_browser)

                  val id = intent.getLongExtra("id", -1L)
                  val s = SiteStore.byId(this, id) ?: run { finish(); return }
                  siteHost = try { Uri.parse(s.url).host } catch (e: Exception) { null }

                  val toolbar = findViewById<MaterialToolbar>(R.id.toolbar)
                  progressBar = findViewById(R.id.progress)
                  swipe = findViewById(R.id.swipe)
                  webContainer = findViewById(R.id.web_container)
                  errorView = findViewById(R.id.error_view)
                  errorText = findViewById(R.id.error_text)
                  popupContainer = findViewById(R.id.popup_container)
                  popupHolder = findViewById(R.id.popup_holder)

                  toolbar.title = s.name
                  toolbar.subtitle = siteHost
                  toolbar.setNavigationIcon(R.drawable.ic_back)
                  toolbar.setNavigationOnClickListener { onBackPressedDispatcher.onBackPressed() }
                  toolbar.inflateMenu(R.menu.menu_browser)
                  toolbar.setOnMenuItemClickListener { item ->
                      when (item.itemId) {
                          R.id.action_refresh -> { webView.reload(); true }
                          R.id.action_home -> { finish(); true }
                          R.id.action_open_browser -> {
                              val current = webView.url ?: s.url
                              try {
                                  startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(current)))
                              } catch (e: Exception) {
                                  toast("无法打开外部浏览器")
                              }
                              true
                          }
                          R.id.action_copy -> { copyUrl(); true }
                          else -> false
                      }
                  }

                  swipe.setOnRefreshListener { webView.reload() }
                  errorView.findViewById<View>(R.id.btn_retry).setOnClickListener {
                      errorView.visibility = View.GONE
                      webView.reload()
                  }
                  findViewById<View>(R.id.btn_close_popup).setOnClickListener { removePopup() }

                  webView = createWebView()
                  webContainer.addView(
                      webView, 0,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )
                  webView.loadUrl(s.url)

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (popupWebView != null) { removePopup(); return }
                          if (webView.canGoBack()) webView.goBack() else finish()
                      }
                  })
              }

              private fun createWebView(): WebView {
                  val w = WebView(this)
                  configureSettings(w.settings)
                  CookieManager.getInstance().apply {
                      setAcceptCookie(true)
                      setAcceptThirdPartyCookies(w, true)
                  }
                  w.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val u = request.url
                          return if (u.scheme == "http" || u.scheme == "https") {
                              false
                          } else {
                              try { startActivity(Intent(Intent.ACTION_VIEW, u)) } catch (e: Exception) { }
                              true
                          }
                      }

                      override fun onPageStarted(view: WebView, url: String, favicon: Bitmap?) {
                          progressBar.visibility = View.VISIBLE
                          errorView.visibility = View.GONE
                      }

                      override fun onPageFinished(view: WebView, url: String) {
                          progressBar.visibility = View.GONE
                          swipe.isRefreshing = false
                      }

                      override fun onReceivedError(view: WebView, request: WebResourceRequest, error: WebResourceError) {
                          if (request.isForMainFrame) {
                              progressBar.visibility = View.GONE
                              swipe.isRefreshing = false
                              errorText.text = "加载失败：${error.description}"
                              errorView.bringToFront()
                              errorView.visibility = View.VISIBLE
                          }
                      }
                  }
                  w.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView, newProgress: Int) {
                          progressBar.progress = newProgress
                          progressBar.visibility = if (newProgress >= 100) View.GONE else View.VISIBLE
                      }

                      override fun onShowFileChooser(
                          webView: WebView,
                          callback: ValueCallback<Array<Uri>>,
                          params: FileChooserParams
                      ): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = callback
                          val intent = Intent(Intent.ACTION_GET_CONTENT)
                          intent.addCategory(Intent.CATEGORY_OPENABLE)
                          intent.type = "*/*"
                          if (params.mode == FileChooserParams.MODE_OPEN_MULTIPLE) {
                              intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                          }
                          return try {
                              fileChooserLauncher.launch(intent)
                              true
                          } catch (e: Exception) {
                              filePathCallback = null
                              false
                          }
                      }

                      override fun onPermissionRequest(request: PermissionRequest) {
                          runOnUiThread {
                              val needed = mutableListOf<String>()
                              for (res in request.resources) {
                                  when (res) {
                                      PermissionRequest.RESOURCE_AUDIO_CAPTURE ->
                                          if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                                              needed.add(Manifest.permission.RECORD_AUDIO)
                                      PermissionRequest.RESOURCE_VIDEO_CAPTURE ->
                                          if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED)
                                              needed.add(Manifest.permission.CAMERA)
                                      else -> { }
                                  }
                              }
                              if (needed.isEmpty()) {
                                  request.grant(request.resources)
                              } else {
                                  pendingPermissionRequest = request
                                  permissionLauncher.launch(needed.toTypedArray())
                              }
                          }
                      }

                      override fun onCreateWindow(
                          view: WebView, isDialog: Boolean, isUserGesture: Boolean, resultMsg: Message
                      ): Boolean {
                          return openPopup(resultMsg)
                      }

                      override fun onCloseWindow(window: WebView?) {
                          if (window === popupWebView) removePopup()
                      }
                  }
                  w.setDownloadListener { url, userAgent, contentDisposition, mimeType, _ ->
                      handleDownload(url, userAgent, contentDisposition, mimeType)
                  }
                  return w
              }

              private fun configureSettings(s: WebSettings) {
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.databaseEnabled = true
                  s.setSupportZoom(true)
                  s.builtInZoomControls = true
                  s.displayZoomControls = false
                  s.loadWithOverviewMode = true
                  s.useWideViewPort = true
                  s.javaScriptCanOpenWindowsAutomatically = true
                  s.setSupportMultipleWindows(true)
                  s.mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  s.textZoom = 100
                  val ua = s.userAgentString
                  if (ua != null) s.userAgentString = ua.replace("; wv", "")
              }

              private fun openPopup(resultMsg: Message): Boolean {
                  return try {
                      val popup = WebView(this)
                      configureSettings(popup.settings)
                      CookieManager.getInstance().setAcceptThirdPartyCookies(popup, true)
                      popup.webViewClient = object : WebViewClient() {
                          override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                              val u = request.url
                              if (u.scheme == "http" || u.scheme == "https") {
                                  if (siteHost != null && u.host == siteHost) {
                                      webView.loadUrl(u.toString())
                                      removePopup()
                                      return true
                                  }
                                  return false
                              }
                              try { startActivity(Intent(Intent.ACTION_VIEW, u)) } catch (e: Exception) { }
                              return true
                          }
                      }
                      popup.webChromeClient = object : WebChromeClient() {
                          override fun onProgressChanged(view: WebView, newProgress: Int) {
                              progressBar.progress = newProgress
                              progressBar.visibility = if (newProgress >= 100) View.GONE else View.VISIBLE
                          }
                          override fun onCloseWindow(window: WebView?) { removePopup() }
                      }
                      val transport = resultMsg.obj as WebView.WebViewTransport
                      transport.webView = popup
                      resultMsg.sendToTarget()
                      popupHolder.removeAllViews()
                      popupHolder.addView(
                          popup,
                          FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                          )
                      )
                      popupContainer.visibility = View.VISIBLE
                      popupWebView = popup
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun removePopup() {
                  runOnUiThread {
                      val p = popupWebView
                      popupWebView = null
                      if (p != null) {
                          (p.parent as? ViewGroup)?.removeView(p)
                          try { p.destroy() } catch (e: Exception) { }
                      }
                      popupHolder.removeAllViews()
                      popupContainer.visibility = View.GONE
                  }
              }

              private fun handleDownload(url: String, userAgent: String, contentDisposition: String?, mimeType: String?) {
                  if (url.startsWith("blob:") || url.startsWith("data:")) {
                      toast("该网站使用了特殊下载方式，请尝试在页面内长按保存")
                      return
                  }
                  try {
                      val name = URLUtil.guessFileName(url, contentDisposition, mimeType)
                      val request = DownloadManager.Request(Uri.parse(url)).apply {
                          setMimeType(mimeType)
                          setTitle(name)
                          setDescription(name)
                          setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                          setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name)
                          addRequestHeader("User-Agent", userAgent)
                          CookieManager.getInstance().getCookie(url)?.let { addRequestHeader("Cookie", it) }
                      }
                      if (Build.VERSION.SDK_INT < 29 &&
                          checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED
                      ) {
                          pendingDownload = request
                          downloadPermissionLauncher.launch(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                      } else {
                          enqueueDownload(request)
                      }
                  } catch (e: Exception) {
                      toast("下载失败：${e.message}")
                  }
              }

              private fun enqueueDownload(request: DownloadManager.Request) {
                  try {
                      (getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(request)
                      toast("已开始下载")
                  } catch (e: Exception) {
                      toast("下载失败")
                  }
              }

              private fun copyUrl() {
                  val url = webView.url ?: return
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("url", url))
                  toast("已复制当前网址")
              }

              private fun toast(msg: String) {
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
              }

              override fun onPause() {
                  super.onPause()
                  pausedAt = SystemClock.elapsedRealtime()
                  CookieManager.getInstance().flush()
              }

              override fun onResume() {
                  super.onResume()
                  if (pausedAt > 0) {
                      val interval = SiteStore.getRefreshInterval(this)
                      val elapsed = SystemClock.elapsedRealtime() - pausedAt
                      pausedAt = 0
                      if (interval > 0 && elapsed >= interval && filePathCallback == null) {
                          webView.reload()
                      }
                  }
              }

              override fun onDestroy() {
                  removePopup()
                  if (this::webView.isInitialized) {
                      (webView.parent as? ViewGroup)?.removeView(webView)
                      webView.destroy()
                  }
                  super.onDestroy()
              }
          }
          EOF

